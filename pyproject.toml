[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "myllm"
version = "0.1.0"
description = "Building a small LLM from scratch: tokenizers, data sampling and more."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Jxchen26", email = "xunjacky@gmail.com" }]
dependencies = [
    "tiktoken>=0.14",
    "torch>=2.14",
]

[tool.setuptools]
py-modules = ["main"]
